<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for cabledesk-helper.

  Confirmed necessary by hands-on testing during this milestone: without
  this file, the default system bus policy refuses
  RequestName("org.cabledesk.Helper1") with AccessDenied for any
  non-root-owned policy, and even root needs an explicit <allow own="..."/>
  under the current default-deny system bus configuration.

  This only grants bus-level "may own this name" / "may call methods on
  this interface" access. It intentionally does NOT itself authorise any
  privileged action — every mutating method must still perform its own
  org.freedesktop.PolicyKit1.Authority.CheckAuthorization call before doing
  anything (see docs/SECURITY.md). Loosening this file can never substitute
  for that per-call check.
-->
<busconfig>
  <policy user="root">
    <allow own="org.cabledesk.Helper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.cabledesk.Helper1"/>
    <allow receive_sender="org.cabledesk.Helper1"/>
  </policy>
</busconfig>
