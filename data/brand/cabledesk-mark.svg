<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 128 128" role="img" aria-label="CableDesk mark">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#2A1C10"/>
      <stop offset="55%" stop-color="#1A120A"/>
      <stop offset="100%" stop-color="#0E0A06"/>
    </linearGradient>
    <linearGradient id="cable" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F5C48A"/>
      <stop offset="45%" stop-color="#E8A45C"/>
      <stop offset="100%" stop-color="#C47E38"/>
    </linearGradient>
    <linearGradient id="facet" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#F5C48A" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#C47E38" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="46" fill="#E8A45C" opacity="0.08"/>
  <!-- left USB-C -->
  <rect x="16" y="48" width="32" height="32" rx="7" fill="none" stroke="url(#cable)" stroke-width="6"/>
  <path fill="none" stroke="url(#cable)" stroke-width="6" stroke-linecap="round"
        d="M24 48V38 M40 48V38"/>
  <!-- right USB-C -->
  <rect x="80" y="48" width="32" height="32" rx="7" fill="none" stroke="url(#cable)" stroke-width="6"/>
  <path fill="none" stroke="url(#cable)" stroke-width="6" stroke-linecap="round"
        d="M88 48V38 M104 48V38"/>
  <!-- cable bridge -->
  <path fill="none" stroke="url(#cable)" stroke-width="7" stroke-linecap="round"
        d="M48 64h32"/>
  <!-- compact thunderbolt spark at center -->
  <circle cx="64" cy="64" r="11" fill="#1A120A"/>
  <path fill="url(#facet)" d="M67 52l-8 14h6l-4 14 12-16h-6z"/>
